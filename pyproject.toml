[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-application-agent"
version = "0.1.0"
description = "Privacy-first job application tracking from Gmail"
requires-python = ">=3.11"
dependencies = ["pydantic>=2,<3", "python-dotenv>=1,<2", "google-api-python-client>=2,<3", "google-auth-oauthlib>=1,<2", "google-auth-httplib2>=0.2,<1", "requests>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]

[project.scripts]
job-tracker = "job_tracker.main:main"

[tool.setuptools.packages.find]
where = ["src"]
